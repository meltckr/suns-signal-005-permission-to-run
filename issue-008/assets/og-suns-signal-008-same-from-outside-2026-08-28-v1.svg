<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Suns Signal Weekly Issue 008: The Same From the Outside</title>
  <desc id="desc">Oso Ighodaro rises toward the rim beside the edition title and the themes availability, voice, and range.</desc>
  <defs>
    <linearGradient id="shade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#070910" stop-opacity="0.99"/>
      <stop offset="0.49" stop-color="#070910" stop-opacity="0.91"/>
      <stop offset="0.72" stop-color="#070910" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#070910" stop-opacity="0.08"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0.58" stop-color="#070910" stop-opacity="0"/>
      <stop offset="1" stop-color="#070910" stop-opacity="0.92"/>
    </linearGradient>
    <linearGradient id="ember" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f36f21"/>
      <stop offset="0.58" stop-color="#f7a23b"/>
      <stop offset="1" stop-color="#27c8c2"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#000" flood-opacity="0.62"/>
    </filter>
    <clipPath id="frame"><rect width="1200" height="630" rx="0"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <image x="0" y="0" width="1200" height="630" xlink:href="oso-ighodaro-high-flying-dunk-official.jpg" preserveAspectRatio="xMidYMid slice"/>
    <rect width="1200" height="630" fill="url(#shade)"/>
    <rect width="1200" height="630" fill="url(#floor)"/>
    <rect x="0" y="0" width="1200" height="10" fill="url(#ember)"/>

    <g font-family="Arial, Helvetica, sans-serif" filter="url(#shadow)">
      <text x="68" y="66" fill="#72d8d4" font-size="22" font-weight="800" letter-spacing="3">SUNS SIGNAL WEEKLY 008</text>
      <text x="68" y="99" fill="#d5d9e1" font-size="16" font-weight="700" letter-spacing="2">FRIDAY EDITION  /  AUGUST 28, 2026</text>

      <rect x="68" y="130" width="190" height="34" rx="17" fill="#f36f21"/>
      <text x="163" y="153" text-anchor="middle" fill="#070910" font-size="17" font-weight="900" letter-spacing="1.5">OSO IGHODARO</text>

      <text x="66" y="250" fill="#ffffff" font-size="70" font-weight="900" letter-spacing="-2">THE SAME</text>
      <text x="66" y="322" fill="#ffffff" font-size="70" font-weight="900" letter-spacing="-2">FROM THE</text>
      <text x="66" y="394" fill="#ffffff" font-size="70" font-weight="900" letter-spacing="-2">OUTSIDE</text>

      <rect x="68" y="432" width="467" height="4" fill="url(#ember)"/>
      <text x="68" y="474" fill="#ffffff" font-size="23" font-weight="800" letter-spacing="2">AVAILABILITY  ·  VOICE  ·  RANGE</text>
      <text x="68" y="510" fill="#c7ccd5" font-size="19" font-weight="600">A connector’s next step becomes measurable.</text>

      <text x="68" y="573" fill="#f7a23b" font-size="16" font-weight="900" letter-spacing="1.7">CURATED FOR MAT ISHBIA</text>
      <text x="68" y="602" fill="#b7bdc8" font-size="14" font-weight="600" letter-spacing="0.8">Prepared by Accelerated Velocity Consulting</text>
    </g>

    <image x="1080" y="42" width="70" height="70" xlink:href="phoenix-suns-logo.png" preserveAspectRatio="xMidYMid meet"/>
  </g>
</svg>
