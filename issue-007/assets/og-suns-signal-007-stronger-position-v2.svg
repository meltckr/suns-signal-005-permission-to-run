<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Suns Signal Weekly Issue 007: Stronger Position</title>
  <desc id="desc">Executive share card for What the Summer Built, showing three early assessments converging on one consequential bet.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080B12"/>
      <stop offset="0.55" stop-color="#0B0F19"/>
      <stop offset="1" stop-color="#171126"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#F59E0B" stop-opacity=".28"/>
      <stop offset=".46" stop-color="#7C3AED" stop-opacity=".14"/>
      <stop offset="1" stop-color="#0B0F19" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFB000"/>
      <stop offset=".58" stop-color="#F97316"/>
      <stop offset="1" stop-color="#FB7185"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2DD4BF"/>
      <stop offset=".5" stop-color="#F59E0B"/>
      <stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#000" flood-opacity=".45"/>
    </filter>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#94A3B8" stroke-opacity=".045" stroke-width="1"/>
    </pattern>
    <clipPath id="cardClip"><rect width="1200" height="630" rx="0"/></clipPath>
  </defs>

  <g clip-path="url(#cardClip)">
    <rect width="1200" height="630" fill="url(#bg)"/>
    <rect width="1200" height="630" fill="url(#grid)"/>
    <circle cx="970" cy="315" r="355" fill="url(#glow)"/>
    <path d="M742 0L1200 0L1200 630L1000 630Z" fill="#FFFFFF" fill-opacity=".018"/>
    <path d="M820 -40C955 115 1078 120 1240 78" fill="none" stroke="#2DD4BF" stroke-opacity=".12" stroke-width="2"/>
    <path d="M760 650C900 490 1055 470 1248 505" fill="none" stroke="#F59E0B" stroke-opacity=".12" stroke-width="2"/>

    <!-- Series identity -->
    <g transform="translate(72 54)">
      <g transform="translate(0 0)">
        <circle cx="24" cy="24" r="20" fill="none" stroke="url(#accent)" stroke-width="3"/>
        <circle cx="24" cy="24" r="10" fill="url(#accent)"/>
        <path d="M24 0V7M24 41V48M0 24H7M41 24H48M7 7L12 12M36 36L41 41M41 7L36 12M12 36L7 41" stroke="#FBBF24" stroke-width="2.4" stroke-linecap="round"/>
      </g>
      <text x="62" y="18" fill="#F8FAFC" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="800" letter-spacing="2.2">SUNS SIGNAL WEEKLY</text>
      <text x="62" y="42" fill="#94A3B8" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="650" letter-spacing="1.7">AUGUST 19, 2026</text>
    </g>
    <g transform="translate(1000 62)">
      <rect width="128" height="42" rx="21" fill="#111827" stroke="#334155"/>
      <text x="64" y="27" text-anchor="middle" fill="#2DD4BF" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="800" letter-spacing="1.8">ISSUE 007</text>
    </g>

    <!-- Primary hook -->
    <text x="72" y="180" fill="#2DD4BF" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="800" letter-spacing="4">THE OWNERSHIP READ</text>
    <text x="68" y="279" fill="#F8FAFC" font-family="Inter,Arial,sans-serif" font-size="86" font-weight="900" letter-spacing="-3.5">STRONGER</text>
    <text x="68" y="366" fill="url(#accent)" font-family="Inter,Arial,sans-serif" font-size="86" font-weight="900" letter-spacing="-3.5">POSITION</text>

    <rect x="72" y="404" width="548" height="2" fill="url(#accent)" opacity=".9"/>
    <text x="72" y="450" fill="#E2E8F0" font-family="Inter,Arial,sans-serif" font-size="25" font-weight="650">Broad confidence in the construction.</text>
    <text x="72" y="486" fill="#94A3B8" font-family="Inter,Arial,sans-serif" font-size="25" font-weight="550">One consequential bet carries the proof.</text>

    <!-- Metric focal -->
    <g filter="url(#shadow)">
      <circle cx="942" cy="326" r="172" fill="#0B1120" fill-opacity=".96" stroke="#334155" stroke-width="2"/>
      <circle cx="942" cy="326" r="157" fill="none" stroke="url(#ring)" stroke-width="3" stroke-opacity=".9"/>
      <circle cx="942" cy="326" r="140" fill="none" stroke="#FFFFFF" stroke-opacity=".055" stroke-width="1"/>
    </g>
    <text x="942" y="225" text-anchor="middle" fill="#94A3B8" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="800" letter-spacing="2.4">EARLY ASSESSMENTS</text>
    <text x="942" y="262" text-anchor="middle" fill="#F8FAFC" font-family="Inter,Arial,sans-serif" font-size="23" font-weight="800" letter-spacing="1.2">B−  ·  B  ·  B+</text>
    <text x="874" y="363" text-anchor="middle" fill="#F8FAFC" font-family="Inter,Arial,sans-serif" font-size="88" font-weight="900">3</text>
    <path d="M919 337H969M955 323L970 337L955 351" fill="none" stroke="#2DD4BF" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="1017" y="363" text-anchor="middle" fill="#FBBF24" font-family="Inter,Arial,sans-serif" font-size="88" font-weight="900">1</text>
    <text x="874" y="402" text-anchor="middle" fill="#94A3B8" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="800" letter-spacing="2">READS</text>
    <text x="1017" y="402" text-anchor="middle" fill="#94A3B8" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="800" letter-spacing="2">BET</text>
    <g transform="translate(827 436)">
      <circle cx="12" cy="12" r="6" fill="#2DD4BF"/>
      <circle cx="36" cy="12" r="6" fill="#2DD4BF" fill-opacity=".72"/>
      <circle cx="60" cy="12" r="6" fill="#2DD4BF" fill-opacity=".44"/>
      <path d="M78 12H130" stroke="#64748B" stroke-width="2" stroke-dasharray="4 6"/>
      <circle cx="148" cy="12" r="10" fill="none" stroke="#F59E0B" stroke-width="3"/>
    </g>

    <!-- Footer -->
    <line x1="72" y1="548" x2="1128" y2="548" stroke="#334155"/>
    <text x="72" y="583" fill="#F8FAFC" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="800" letter-spacing="1.6">CURATED FOR MAT ISHBIA</text>
    <text x="1128" y="583" text-anchor="end" fill="#94A3B8" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="700" letter-spacing="1.35">ACCELERATED VELOCITY CONSULTING</text>
  </g>
</svg>